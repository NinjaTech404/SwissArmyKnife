<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss Army Knife</title>
    <base href="../" target="_self">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/ipinfo_tool.css">
    <link rel="stylesheet" href="assets/icons/bootstrap-icons/bootstrap-icons.css">
</head>
<body>

    <!-- Main Container -->
    <div class="main-container">

        <!-- Side Bar -->
        <div class="side-bar">

            <!-- Side Bar Header -->
            <div class="side-bar-header">
                <i class="bi bi-wrench-adjustable-circle-fill"></i>
                <span>Swiss Army Knife</span>
            </div>

            <div class="separator"></div>

            <!-- Side Bar Body -->
            <div class="side-bar-body">

                <div class="side-bar-option-button">
                    <i class="bi bi-grid-fill"></i>
                    <span>Dashboard</span>
                </div>
            
                <div class="side-bar-option-button">
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>Password Tool</span>
                </div>
            
                <div class="side-bar-option-button">
                    <i class="bi bi-fingerprint"></i>
                    <span>Hash Tool</span>
                </div>
            
                <div class="side-bar-option-button">
                    <i class="bi bi-lock-fill"></i>
                    <span>Encoder Tool</span>
                </div>
            
                <div class="side-bar-option-button">
                    <i class="bi bi-file-earmark-zip-fill"></i>
                    <span>Compress Tool</span>
                </div>
            
                <div class="side-bar-option-button">
                    <i class="bi bi-file-earmark-text-fill"></i>
                    <span>Exiftool</span>
                </div>
            
                <div class="side-bar-option-button side-bar-option-button-active">
                    <i class="bi bi-globe-americas"></i>
                    <span>IP Info Tool</span>
                </div>

            </div>

            <!-- side bar footer -->
            <div class="side-bar-footer">

                <div class="side-bar-footer-button">
                    <i class="bi bi-info-circle-fill"></i>
                    <span>About Us</span>
                    <i class="bi bi-box-arrow-up-right"></i>
                </div>

                <div class="side-bar-footer-button logout-button">
                    <i class="bi bi-person-circle"></i>
                    <span>Log Out</span>
                    <i class="bi bi-box-arrow-right"></i>
                </div>

            </div>

        </div>

        <!-- Content Body -->
        <div class="content-body">
            <!-- Content Header -->
            <div class="content-header">
                <div class="side-bar-toggle-button">
                    <i class="bi bi-layout-sidebar"></i>
                </div>
                <div class="content-header-headline">
                    <i class="bi bi-globe-americas"></i>
                    <span>IP Info Tool</span>
                </div>
                <div class="content-header-list-button">
                    <i class="bi bi-three-dots-vertical"></i>
                </div>
            </div>

            <!-- Content Body Container -->
            <div class="content-body-container">
            <!-- Public IP Info Tool -->
                <div class="ip-tool">

                    <!-- Input Zone -->
                    <div class="ip-input-zone" id="ip-input-zone">
                        <div class="ip-input-card">
                            <div class="ip-input-header">
                                <i class="bi bi-globe2"></i>
                                <span>Public IP Lookup</span>
                            </div>
                            <p class="ip-input-hint">Leave blank to use your current public IP</p>
                            <div class="ip-input-row">
                                <input type="text" id="ip-query-input" class="ip-query-input" placeholder="e.g. 8.8.8.8 (optional)" autocomplete="off" spellcheck="false">
                                <button class="ip-lookup-btn" id="ip-lookup-btn">
                                    <i class="bi bi-search"></i> Lookup
                                </button>
                            </div>
                            <div class="ip-status" id="ip-status"></div>
                        </div>
                    </div>

                    <!-- Results Zone -->
                    <div class="ip-results-zone" id="ip-results-zone" style="display: none;">
                        <div class="ip-card">

                            <!-- Card Header -->
                            <div class="ip-card-header">
                                <div class="ip-result-summary">
                                    <i class="bi bi-geo-alt-fill"></i>
                                    <div class="ip-result-title">
                                        <span id="ip-result-address">0.0.0.0</span>
                                        <span class="ip-result-label" id="ip-result-label">Your Public IP</span>
                                    </div>
                                </div>
                                <button class="ip-reset-btn" id="ip-reset-btn">
                                    <i class="bi bi-arrow-counterclockwise"></i> New Query
                                </button>
                            </div>

                            <!-- Card Body: Sections injected by JS -->
                            <div class="ip-card-body" id="ip-card-body">
                                <!-- Sections will be injected here -->
                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <!-- Additional Component -->

    <div class="dialogue">
        <div class="dialogue-container">
            <!-- Dialogue Header -->
            <div class="dialogue-header">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Warning</span>
            </div>
            <!-- Dialogue Body -->
            <div class="dialogue-body">
                <span>Are you sure you want to logout?</span>
            </div>
            <!-- Dialogue Footer -->
            <div class="dialogue-footer">
                <button class="dialogue-left-button">Cancel</button>
                <button class="dialogue-right-button">Proceed</button>
            </div>
        </div>
    </div>


    <script src="js/global.js"></script>
    <script src="js/ipinfo_tool.js"></script>
</body>
</html>
