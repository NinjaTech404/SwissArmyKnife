<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="./" target="_self">
    <link rel="stylesheet" href="css/global.css">
    <style>
        html,
        body {

            height: 100%;
            margin: 0;

        }

        /* خائص الهيكل العام */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: url("plugins/hex-background.png") center;

        }

        .Primary-name {
            font-family: 'Audiowide';
            color: #18586F;
            font-size: 20pt;
        }

        /*css الخاص بالحاوية الرئسية*/
        .Container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 650px;
            width: clamp(300px, 30%, 480px);
            background-color: #FFFFFF;
            border-radius: 15px;
            box-shadow: 0 12px 40px rgba(60, 40, 30, 0.10);
            overflow: hidden;
        }

        .eco {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0px;
            height: 120px;
            width: 385px;
            background-color: #18586F;
            border-radius: 0 0 180px 180px;

        }

        .login-text {
            font-family: 'Audiowide';
            font-size: 30px;
            color: #FFFFFF;
            margin-top: 4px;

        }

        /*خصائص المدخلات*/
        .inputs {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 120px;
        }

        .user-email {
            background-color: #FFFFFF;
            border: 2px solid #D9DDE1;
            padding: 10px 30px 10px 30px;
            border-radius: 10px;
            width: 100%;
        }

        .label-email {
            position: absolute;
            color: #1D2B36;
            left: 20px;
            top: 8px;
            pointer-events: none;

            transition: background-color 0.4s all ease;
            font-family: 'Aldrich';
        }

        /* هنا خصائص label وinputs من يصير تركيز عليه */
        .user-email:focus+.label-email,
        .user-email:not(:placeholder-shown)+.label-email {
            top: 0px;
            transition: 0.4s ease;
            transform: translateY(-50%) scale(0.85);
            color: #1F6F8B;
            background-color: #f4f3ef;
            border-radius: 6px;

        }

        .user-email:focus,
        .user-email:not(:placeholder-shown) {
            transition: 0.4s ease;
            background-color: #f4f3ef;
            outline: none;
            border-color: #5d5555;
            box-shadow: 0 0 0 3px rgba(31, 111, 139, 0.15);
        }


        /* خصائص الباسورد */
        .user-password {
            background-color: #FFFFFF;
            border: 2px solid #D9DDE1;
            padding: 10px 30px 10px 30px;
            border-radius: 10px;
            margin-top: 10px;
            width: 100%;
        }

        .label-pass {
            position: absolute;
            color: #1D2B36;
            left: 18px;
            top: 58px;
            pointer-events: none;

            transition: background-color 0.4s all ease;
            font-family: 'Aldrich';
        }

        /* هنا خصائص label وinputs من يصير تركيز عليه */
        .user-password:focus+.label-pass,
        .user-password:not(:placeholder-shown)+.label-pass {
            top: 50px;
            transition: 0.4s ease;
            transform: translateY(-50%) scale(0.85);
            color: #5d5555;
            background-color: #f4f3ef;
            border-radius: 6px;

        }

        .user-password:focus,
        .user-password:not(:placeholder-shown) {
            transition: 0.4s ease;
            background-color: #f4f3ef;
            outline: none;
            border-color: #1F6F8B;
            box-shadow: 0 0 0 3px rgba(31, 111, 139, 0.15);

        }

        /* خصائص نسيان الباسورد */
        .forgot-pass {
            position: absolute;
            color: #5f6672;
            font-size: 8pt;
            font-family: 'Aldrich';
            top: 100px;
            left: 4px;
            cursor: pointer;
        }

        .forgot-pass:hover {
            font-size: 9px;
            text-decoration: underline;
            color: blue;
        }

        /* الحاوية الاساسية للLog in */
        .login-box {
            display: flex;
            flex-direction: column;
            position: relative;

            margin-top: 30px;
        }

        /* خصائص زر تسجيل لدخول */
        .login-button {
            padding: 5px 100px 5px 100px;
            border-radius: 10px;
            border: 1.5px solid #1F6F8B;
            cursor: pointer;
            transition: 0.2s ease;
            margin-bottom: 30px;
            background-color: #1F6F8B;
            color: #FFFFFF;
            box-shadow: 0 6px 16px rgba(31, 111, 139, 0.30);
            height: 40px;

        }

        .login-button:hover {
            color: #18586F;
            background-color: #ffffff;
            transition: 0.2s ease;

        }

        /* خصائص التسحيل عن طريق كوكل */
        .google-login {
            padding: 8px 30px 8px 30px;
            border-radius: 1rem;
            border: 2px solid #D9DDE1;
            transition: 0.2s all ease;
            cursor: pointer;
            margin-bottom: 10px;
            background-color: #FFFFFF;
            border-color: #D9DDE1;
            color: #1D2B36;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);

        }

        .google-login:hover {
            background-color: #303841;
            color: white;
        }

        /* خصائص صوره الخاصة بكوكل */
        .img-google {
            position: absolute;
            width: 10%;
            bottom: 60px;
            left: 15px;
        }

        /* خصائص التسحيل عن طريق فيسبوك */
        .facebook-login {
            padding: 8px 30px 8px 30px;
            border-radius: 1rem;
            border: 2px solid #D9DDE1;
            transition: 0.2s all ease;
            cursor: pointer;
            margin-bottom: 10px;
            background-color: #FFFFFF;
            border-color: #D9DDE1;
            color: #1D2B36;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        /* خصائص صوره الخاصة بفيسبوك*/
        .img-facebook {
            position: absolute;
            width: 9%;
            bottom: 16px;
            left: 17px;
        }

        .facebook-login:hover {
            background-color: #303841;
            color: white;
        }

        /* الحاوية الاساسية للشروط  */
        .terms {
            position: relative;
            margin-top: 30px;
        }

        /* النص الخاص بالشروط */
        .terms-text{
            font-family: 'Aldrich';
            font-size: 8pt;
            width: 170px;

        }

        .page-link{
            color: var(--accent-blue);
            font-family: 'Aldrich';
            font-size: 8pt;
        }
        .page-link:hover{
            color: var(--content-body-header-color);
        }

        .checkbox-label {
            position: absolute;


        }

        /* Customized */
        .error-message{
            position: absolute;
            top: -50px;
            font-family: "Aldrich";
            color: var(--accent-red);
            text-align: center;
            display: none;
        }

        .input-form{
            position: relative;
            width: 60%;
        }
        

    </style>
</head>

<body>
    <p class="Primary-name">Swiss Army Knife</p>
    <div class="Container"><!--الحاوية الاساسية -->
        <div class="eco">
            <p class="login-text">Login</p>
        </div>
        <!-- الحاوية الخاصة بادخلات المستخدم-->
        <div class="inputs">
            <span class="error-message"></span>
            <form class="input-form">

            <input class="user-email" type="email" id="login-email" placeholder=" " required>
            <label class="label-email" for="email">
                Email
            </label>
            <input class="user-password" type="password" id="login-pass" placeholder=" " required>
            <label class="label-pass" for="password">Password</label>

            </form>
            <!--حاوية تسجيل الدخول المتعدده-->
            <div class="login-box">
                <button type="button" class="login-button login-event" id="login-button">Login</button>
                <button class="google-login">Login with Google</button>
                <img class="img-google" src="plugins/images/google-color-svgrepo-com.svg">
                <button class="facebook-login">Login with Facebook</button>
                <img class="img-facebook" src="plugins/images/facebook-color-svgrepo-com.svg">
            </div>
            <!-- الحاوية الخاصة بالشروط -->
            <div class="terms">
                <span class="terms-text"> Don't have an account, </span>
                <a class="page-link" href="index/signup.html"> Sign Up </a>
            </div>
        </div>







    </div>

    <script src="js/local_storage.js"></script>
</body>
</html>
